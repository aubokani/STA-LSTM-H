# =============================================================================
# config/hpc.cfg — Ada-specific paths and resource settings
# =============================================================================
# Source this file in any script to get consistent Ada configuration:
#   source config/hpc.cfg
# =============================================================================

# --- Ada connection -----------------------------------------------------------
HPC_HOST="ada.cqu.edu.au"
HPC_USER="${USER}"                   # overridden by $USER at login time

# --- Remote paths -------------------------------------------------------------
REMOTE_PROJECT_DIR="~/projects/2026-STA-LSTM-H"
REMOTE_DATA_DIR="/home/bokania/projects/2026-STA-LSTM-H/data/raw"
REMOTE_VENV_DIR="${REMOTE_PROJECT_DIR}/.venv"

# --- Slurm partition names (from Ada docs) ------------------------------------
#   workq         : standard CPU nodes (HPC05-N001–N008, 96 cores, 768 GB)
#   gpucomputeq   : GPU nodes (L40S: 48 cores, 512 GB, 1×L40S / H100: 2×H100)
#   largeq         : large-memory nodes (96 cores, 1.5 TB)
PARTITION_CPU="workq"
PARTITION_GPU="gpucomputeq"
PARTITION_LARGE="largeq"

# --- Per-task resource request ------------------------------------------------
CPUS_PER_TASK=8
MEM_PER_TASK_GB=32
WALL_TIME="04:00:00"      # HH:MM:SS  (GPU QoS max = 24 h)
GPU_COUNT=1

# --- Python module (verified from Ada module avail) --------------------------
PYTHON_MODULE="Python/3.12.3-GCCcore-13.3.0-deep-learning-cpu"
